[package]
name = "dramma"
version = "0.4.1"
edition = "2024"
build = "build.rs"
publish = false
license = "MIT"

[[bin]]
path = "src/main.rs"
name = "dramma"

[dependencies]
slint = { version = "1.14.1", features = ["renderer-skia"] }
serialport = "4.2"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
isahc = { version = "1.7", features = ["json"] }
http = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
cc_talk_core = "0.0.4"
cc_talk_tokio_host = "0.1.1"
cc_talk_host = "0.0.5"
tokio = { version = "1", features = ["rt", "time"] }
tokio-serial = "5"
image = "0.25"

[build-dependencies]
slint-build = "1.14.1"
