# The kiosk display's active VGA mode is 1280x1024 at 60.02 Hz. Leaving this
# at 0 makes RetroArch's threaded video loop run DOOM several times too fast.
# Core timing options are kept in a separate tracked file so menu changes and
# stale per-core option files cannot change the selected frame rate.

video_refresh_rate = "60.020000"
video_vsync = "true"
video_swap_interval = "1"
video_threaded = "true"
audio_sync = "true"
audio_rate_control = "true"
video_adaptive_vsync = "false"
vrr_runloop_enable = "false"
core_options_path = "/home/dramma/dramma-app/retroarch-core-options.cfg"
global_core_options = "true"

fastforward_ratio = "1.000000"
input_toggle_fast_forward = "nul"
input_hold_fast_forward = "nul"
input_toggle_slowmotion = "nul"
input_hold_slowmotion = "nul"
